<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5" style="max-width: 600px">
    <h1>Tasks</h1>
    <p id="summary" class="text-secondary">Loading…</p>

    <form id="add-form" class="input-group mb-3">
      <input id="title" class="form-control" placeholder="What needs doing?" maxlength="200" aria-label="New task">
      <button class="btn btn-primary">Add</button>
    </form>

    <div id="error" class="alert alert-danger d-none" role="alert"></div>
    <ul id="list" class="list-group"></ul>
  </main>

  <!-- One task row; the script copies it for every task -->
  <template id="row">
    <li class="list-group-item d-flex align-items-center gap-2">
      <input class="form-check-input mt-0" type="checkbox">
      <span class="flex-grow-1 text-break"></span>
      <button class="btn btn-sm btn-outline-secondary">Edit</button>
      <button class="btn btn-sm btn-outline-danger">Delete</button>
    </li>
  </template>

  <script>
    const list = document.getElementById("list");
    const errorBox = document.getElementById("error");

    // Calls the API and returns the JSON response, or throws the API's error message
    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body && JSON.stringify(body),
      });
      if (!res.ok) {
        const { detail } = await res.json();
        throw new Error(typeof detail === "string" ? detail : "Please check what you typed.");
      }
      return res.status === 204 ? null : res.json();
    }

    // Runs an action, then reloads the list so the page always matches the database
    async function run(action) {
      try {
        await action();
        const tasks = await api("GET", "/tasks?limit=100");
        list.replaceChildren(...tasks.map(taskRow));
        const left = tasks.filter((t) => !t.completed).length;
        document.getElementById("summary").textContent =
          tasks.length ? `${left} of ${tasks.length} left to do` : "No tasks yet. Add one above.";
        errorBox.classList.add("d-none");
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove("d-none");
      }
    }

    function taskRow(task) {
      const row = document.getElementById("row").content.firstElementChild.cloneNode(true);
      const [check, title, editButton, deleteButton] = row.children;

      title.textContent = task.title; // textContent, not innerHTML: titles are user input
      title.classList.toggle("text-decoration-line-through", task.completed);
      title.classList.toggle("text-secondary", task.completed);
      check.checked = task.completed;
      check.setAttribute("aria-label", `Done: ${task.title}`);

      check.onchange = () => run(() => api("PATCH", `/tasks/${task.id}`, { completed: check.checked }));
      editButton.onclick = () => {
        const newTitle = prompt("Edit task", task.title)?.trim();
        if (newTitle && newTitle !== task.title) run(() => api("PATCH", `/tasks/${task.id}`, { title: newTitle }));
      };
      deleteButton.onclick = () => run(() => api("DELETE", `/tasks/${task.id}`));
      return row;
    }

    document.getElementById("add-form").onsubmit = (event) => {
      event.preventDefault();
      const input = document.getElementById("title");
      const title = input.value.trim();
      if (title) run(async () => { await api("POST", "/tasks", { title }); input.value = ""; });
    };

    run(() => {}); // first load
  </script>
</body>
</html>
